# RFID bridge configuration (overridable by -Dkey=val system props or ENV vars)

# Port this bridge listens on = the reader's Destination Port
listen.port=20059

# Backend endpoint that receives the scanned EPC
backend.url=http://localhost:8000/api/v1/transactions/rfid-reads

# Device credential sent in the x-api-key header. Mint one as an admin via
# POST /api/v1/api-keys, then paste the returned key here. Revoke it anytime via
# PATCH /api/v1/api-keys/{id}/revoke. An empty/unknown/revoked key -> backend returns 401.
api.key=rfid_67e672163908a3b07c297e943dde5432b49253ea29b898b1

# Set false to ONLY print detected EPCs (no HTTP POST) -- handy before the backend is ready
post.enabled=true

# Frame format: AUTO_DETECT | AUTO_VAR | AUTO_FIXED12 | PROTOCOL_E0
# Start with AUTO_DETECT, then pin to the exact format once confirmed from the RX logs.
frame.format=AUTO_DETECT

# Presence sessions: the reader fires the same EPC many times/sec while a tag sits in
# the field, but the backend opens a NEW transaction on every POST. So the bridge POSTs
# once per tag presence (on first sight) and stays quiet on repeats.
#
# session.gap.ms = quiet time with no reads before a tag's session closes. The same EPC
# reappearing after this gap starts a fresh transaction. Set it comfortably above the
# longest momentary read drop-out you expect (e.g. a truck nudging forward). 5s is safe.
# (Legacy alias: dedup.window.ms is still read if session.gap.ms is absent.)
session.gap.ms=5000

# session.max.ms = safety cap: force-close a session this long after it opened, even if
# the tag is still being read. 0 = disabled (a parked tag stays one transaction).
session.max.ms=0

# Log every raw byte chunk received (helpful during commissioning; set false in production)
log.raw=true
