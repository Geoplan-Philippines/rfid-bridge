# RFID bridge configuration (overridable by -Dkey=val system props or ENV vars)

# Port this bridge listens on = the reader's Destination Port
listen.port=20059

# Backend endpoint that receives the scanned EPC
backend.url=http://localhost:8000/api/v1/transactions/rfid-reads

# Set false to ONLY print detected EPCs (no HTTP POST) -- handy before the backend is ready
post.enabled=true

# Frame format: AUTO_DETECT | AUTO_VAR | AUTO_FIXED12 | PROTOCOL_E0
# Start with AUTO_DETECT, then pin to the exact format once confirmed from the RX logs.
frame.format=AUTO_DETECT

# Ignore repeats of the same EPC within this window (ms). Readers fire many times/sec.
dedup.window.ms=3000

# Log every raw byte chunk received (helpful during commissioning; set false in production)
log.raw=true
